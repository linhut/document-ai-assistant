name: Star History

# 已停用自动调度：star-history 图片不再入库（见 .gitignore 中 assets/star-history/），
# README 改用在线 API（api.star-history.com）展示。如需重新启用，取消下方注释并调整输出目录。
on:
  workflow_dispatch:          # 仅手动触发
  # schedule:
  #   - cron: '0 */6 * * *'   # 每 6 小时更新一次（已停用）

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: narayann7/star-history-action@v1
        with:
          repos: ${{ github.repository }}
